# Generated by bin/monorepo sync, do not edit.
name: Bug report
description: Something in a package does not work as documented.
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - thesis/amqp
        - thesis/async
        - thesis/async-trace
        - thesis/cache
        - thesis/dispatcher
        - thesis/exceptionally
        - thesis/formatter
        - thesis/http
        - thesis/http-client
        - thesis/http-server
        - thesis/io
        - thesis/net
        - thesis/phpstan-extension
        - thesis/source-location
        - thesis/testo-plugin
        - thesis/time
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version of the package (`composer show thesis/<name>`), PHP and the OS.
      placeholder: 0.1.2, PHP 8.6.0, Linux
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Code that reproduces it
      description: As short as you can make it.
      render: php
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened instead
      description: With the exception and its trace, if there is one.
    validations:
      required: true

name: Check

on:
  workflow_dispatch: ~
  push:
    branches: [main, '*.*.x']
  pull_request: ~

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Generated files and the lock are checked by regenerating them: sync is the only source of truth.
      - run: make sync
      - run: git diff --exit-code
      # The checks of `make check` except the tests: they run in the test job, on every PHP version.
      - run: make fixer-check rector-check phpstan deps-analyze

  # Time\Duration is a polyfill on PHP 8.5 and native on PHP 8.6: the code runs against both.
  # The Revolt drivers differ in signals, closed streams and the order of callbacks: the code runs on each.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.6']
        driver: [StreamSelect, Uv, Ev, Event]
    env:
      PHP_VERSION: ${{ matrix.php }}
      DRIVER: ${{ matrix.driver }}
    steps:
      - uses: actions/checkout@v6
      - run: make test

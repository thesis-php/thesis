name: Check

on:
  workflow_dispatch: ~
  push:
    branches: [main, '*.*.x']
  pull_request: ~

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Generated files and the lock are checked by regenerating them: sync is the only source of truth.
      - run: make sync
      - run: git diff --exit-code
      - run: make up
      - run: make check

name: Check

on:
  push:
    branches: [main]
  pull_request: ~

# Only a pull request cancels its older runs. A run of main is in a group of its own: a pending run of a shared group
# would be replaced by a newer one, its release with it.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Generated files and the lock are checked by regenerating them: sync is the only source of truth.
      - run: make sync
      - run: git diff --exit-code
      # The checks of `make check` except the tests: they run in the test job.
      - run: make fixer-check rector-check phpstan deps-analyze

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make test

  # A package that runs on an older PHP than the monorepo (thesis/time on 8.2 with the polyfill of Time\Duration)
  # is installed alone and tested on every older PHP it allows: the matrices are of the manifests.
  test-alone:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # test-alone (generated by bin/monorepo sync, do not edit)
        include: [{package: formatter, php: '8.4'}, {package: formatter, php: '8.5'}, {package: source-location, php: '8.4'}, {package: source-location, php: '8.5'}, {package: time, php: '8.2'}, {package: time, php: '8.3'}, {package: time, php: '8.4'}, {package: time, php: '8.5'}]
    env:
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v6
      - run: make test-alone P=${{ matrix.package }}

  # A package with bit32Testing in its manifest on 32-bit PHP, on its lowest PHP and on that of the monorepo
  # (thesis/time: the polyfill and the functions against the class of PHP 8.6).
  # The official images, ours have no i386 build.
  test-32-bit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # test-32-bit (generated by bin/monorepo sync, do not edit)
        include: [{package: time, php: '8.2'}, {package: time, php: '8.6'}]
    env:
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v6
      - run: make test-alone P=${{ matrix.package }} ARCH=386

  # Mutation testing of the packages with mutationTesting in their manifests (agents/tests.md).
  # On ARM: Xdebug of the PHP 8.6 image crashes on x86_64 under coverage per test (agents/tests.md).
  # Allowed to fail and out of `needs` of the release until the mutants of io and async-trace are killed.
  infect:
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # infect (generated by bin/monorepo sync, do not edit)
        package: [async, async-trace, cache, dispatcher, exceptionally, formatter, io, net, source-location, testo-plugin, time]
    steps:
      - uses: actions/checkout@v6
      - run: make infect P=${{ matrix.package }}
      # The score of the package goes to its module of the monorepo in the Stryker Dashboard for the badge
      # of its README.md (agents/tests.md), also when Infection has failed on a surviving mutant. Not sent
      # by Infection (logs.stryker): it knows no modules, the packages would overwrite one score.
      - if: ${{ !cancelled() && github.event_name == 'push' }}
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
          REPORT: github.com/${{ github.repository }}/${{ github.ref_name }}?module=${{ matrix.package }}
        run: |
          score=$(jq --exit-status .stats.msi var/infection/${{ matrix.package }}.json)
          curl --fail-with-body --silent --show-error --request PUT \
            --header 'Content-Type: application/json' --header "X-Api-Key: $STRYKER_DASHBOARD_API_KEY" \
            --data "{\"mutationScore\": $score}" "https://dashboard.stryker-mutator.io/api/reports/$REPORT"

  # The coverage of every package by its own tests, uploaded to Codecov with the flag of the package for the badge
  # of its README.md (the components of .github/codecov.yml). On ARM like infect (agents/tests.md).
  # Out of `needs` of the release: a badge does not hold back a release.
  coverage:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # coverage (generated by bin/monorepo sync, do not edit)
        package: [amqp, async, async-trace, cache, dispatcher, exceptionally, formatter, io, net, source-location, testo-plugin, time]
    steps:
      - uses: actions/checkout@v6
      - run: make coverage P=${{ matrix.package }}
      - uses: codecov/codecov-action@v5
        with:
          files: var/coverage/${{ matrix.package }}.xml
          flags: ${{ matrix.package }}
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # Counts under Valgrind on one PHP and one driver (agents/benchmarks.md). The results are an artifact
  # for `make bench-accept`: `gh run download <run> -p 'tally-*' -D var/tally`.
  # Allowed to fail and out of `needs` of the release until the numbers of the event loop of thesis/async
  # are accepted from a run of this job (agents/benchmarks.md).
  bench:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make bench
      - if: ${{ always() }}
        run: cat var/tally-summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: tally-results
          path: var/tally
          if-no-files-found: ignore

  # A push of main whose checks passed releases every changelog heading that has no tag yet (agents/releases.md):
  # a release that failed is released by the next push, or by a re-run of the failed jobs.
  release:
    needs: [check, test, test-alone, test-32-bit]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The whole history: the release splits the commit and compares it with the tags of the split repositories.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # The app pushes the tags and makes the releases in the split repositories, bypassing their rulesets,
      # and repeats the releases in the monorepo. Workflows: GitHub refuses a tag of the monorepo at a commit
      # whose workflows differ from those of main to a token that may not write them (agents/releases.md).
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: thesis-php
          permission-administration: read
          permission-contents: write
          permission-workflows: write
      - run: make release
        env:
          COMMIT: ${{ github.sha }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          SPLIT_REMOTE: https://x-access-token:${{ steps.token.outputs.token }}@github.com/thesis-php

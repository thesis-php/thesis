name: Check

on:
  push:
    branches: [main]
  pull_request: ~
  # Repairs a release that failed: the version under [Unreleased] of the packages at a commit of main
  # whose checks passed, with the tooling of the head of main. The checks do not run again: the image
  # and the tools float, so an old commit could fail checks it passed.
  workflow_dispatch:
    inputs:
      commit:
        description: A commit of main whose checks passed
        required: true
      packages:
        description: The packages to release, separated by spaces
        required: true

# Only a pull request cancels its older runs. A run of main is in a group of its own: a pending run of a shared group
# would be replaced by a newer one, its release with it.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Generated files and the lock are checked by regenerating them: sync is the only source of truth.
      - run: make sync
      - run: git diff --exit-code
      # The checks of `make check` except the tests: they run in the test job, on every PHP version.
      - run: make fixer-check rector-check phpstan deps-analyze

  # Time\Duration is a polyfill on PHP 8.5 and native on PHP 8.6: the code runs against both.
  # The Revolt drivers differ in signals, closed streams and the order of callbacks: the code runs on each.
  test:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.6']
        driver: [StreamSelect, Uv, Ev, Event]
    env:
      PHP_VERSION: ${{ matrix.php }}
      DRIVER: ${{ matrix.driver }}
    steps:
      - uses: actions/checkout@v6
      - run: make test

  # A push of main releases the changelog headings it added (agents/releases.md), after every check passed.
  # The name is that of Checks::RELEASE_JOB: a dispatch requires a run whose other jobs passed.
  release:
    needs: [check, test]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && needs.check.result == 'success' && needs.test.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Checks::passed() reads the runs of this workflow for a dispatch.
      actions: read
    steps:
      # The whole history: the release splits the commit and compares it with the tags of the split repositories.
      # The checkout of a dispatch is the head of main: its tooling releases an older commit.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # The app pushes the tags and makes the releases in the split repositories, bypassing their rulesets.
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: thesis-php
          permission-administration: read
          permission-contents: write
      # The inputs go through the environment, not into the script.
      - run: make release
        env:
          COMMIT: ${{ inputs.commit || github.sha }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          PACKAGES: ${{ inputs.packages }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          CHECKS_TOKEN: ${{ github.token }}
          SPLIT_REMOTE: https://x-access-token:${{ steps.token.outputs.token }}@github.com/thesis-php

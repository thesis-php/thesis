name: Split

# Only main is split, to main of every package: a version is a tag that the release of check.yaml pushes.
on:
  push:
    branches: [main]

# One split at a time: a pending one is replaced by a newer one, whose split contains it.
concurrency:
  group: split

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # The app creates thesis-php/<name>, bypasses the rulesets that make it read-only
      # and adds the webhook of Packagist.
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: thesis-php
          permission-administration: write
          permission-contents: write
          permission-repository-hooks: write
      # Before the split: a package needs its repository before the first push. It is registered on Packagist
      # by the run after it, once main exists. The main API token: Packagist creates no package with the safe one.
      - id: github
        run: make github
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          PACKAGIST_USERNAME: ${{ vars.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
      # Even when github failed for some repositories: the others get their splits, the job fails anyway.
      # A repository without the rulesets of the split gets no push: an older package of the same name lacks main,
      # so a push would create it. A push is never forced.
      - if: ${{ !cancelled() && steps.token.outcome == 'success' }}
        run: make split
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          SPLIT_REMOTE: https://x-access-token:${{ steps.token.outputs.token }}@github.com/thesis-php

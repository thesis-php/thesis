services:
  php:
    image: ghcr.io/phpyh/php:${PHP_VERSION:-8.5}
    user: ${DOCKER_USER:-}
    working_dir: /workspace
    environment:
      IN_CONTAINER: true
      HISTFILE: /workspace/var/.docker_history
      # Integration tests skip a service that is not up (make up), and fail instead in CI.
      CI: ${CI:-}
      AMQP_URI: amqp://thesis:thesis@rabbitmq:5672/
    volumes:
      - .:/workspace
      - ~/.composer/cache:/composer/cache
    tty: true
    init: true

  rabbitmq:
    image: rabbitmq:4.1-alpine
    environment:
      # guest may connect only from localhost, the tests connect from the php container.
      RABBITMQ_DEFAULT_USER: thesis
      RABBITMQ_DEFAULT_PASS: thesis
    healthcheck:
      # ping answers before the AMQP listener accepts connections, and the first tests would be refused.
      test: rabbitmq-diagnostics --quiet check_port_connectivity
      interval: 2s
      timeout: 5s
      retries: 30
